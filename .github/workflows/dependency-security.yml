name: Python dependency security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PIP_ONLY_BINARY: ':all:'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.15'
      - name: Install audit and test tools
        run: python -m pip install pip-audit==2.10.1 pytest==9.1.1 setuptools==84.1.0
      - name: Read runtime dependency pins without executing the project
        run: |
          python - <<'PY'
          import pathlib, tomllib
          project = tomllib.loads(pathlib.Path('pyproject.toml').read_text())
          pathlib.Path('audit-requirements.txt').write_text('\n'.join(project['project']['dependencies']) + '\n')
          PY
      - name: Audit direct and transitive runtime dependencies
        run: python -m pip_audit --strict -r audit-requirements.txt
      - name: Install and test with the patched Python runtime
        run: |
          python -m pip install --no-build-isolation .
          python -m pip check
          python -m pytest -q
